<style>
  :root {
    --accent: #2f7bf2;
    --line-color: rgba(128, 128, 128, 0.25);
    --card-background: rgba(128, 128, 128, 0.08);
  }

  [hidden] {
    display: none !important;
  }

  .page {
    padding: 4px 0 24px;
  }

  .muted {
    opacity: 0.65;
  }

  .small {
    font-size: 0.85rem;
  }

  .intro-text {
    margin: 4px 0 12px;
  }

  .help-text {
    margin: 8px 0 0;
  }

  .section-heading {
    margin: 18px 16px 6px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .card {
    background: var(--card-background);
    border-radius: 14px;
    overflow: hidden;
  }

  .text-input {
    box-sizing: border-box !important;
    width: 100%;
    height: 44px !important;
    padding: 0 16px !important;
    border: 0;
    border-radius: 10px;
    background: var(--card-background);
    color: inherit;
    font: inherit;
    line-height: 44px !important;
    text-indent: 0 !important;
    -webkit-appearance: none;
    appearance: none;
  }

  .text-input:focus {
    outline: 2px solid var(--accent);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    padding: 8px 16px;
    text-transform: none;
  }

  .setting-label {
    font-size: 1rem;
  }

  .number-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .number-input {
    box-sizing: border-box !important;
    width: 84px;
    height: 38px !important;
    padding: 0 12px !important;
    border: 0;
    border-radius: 9px;
    background: rgba(128, 128, 128, 0.18);
    color: inherit;
    font: inherit;
    line-height: 38px !important;
    text-align: right;
    text-indent: 0 !important;
  }

  .number-input:focus {
    outline: 2px solid var(--accent);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }

  .button {
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--card-background);
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    text-transform: none;
    cursor: pointer;
    user-select: none;
  }

  .button.primary {
    background: var(--accent);
    color: #fff;
  }

  .button:active {
    opacity: 0.75;
  }

  .device-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    margin: 0 0 6px;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--card-background);
    line-height: 1.25;
    text-transform: none;
    letter-spacing: normal;
    cursor: pointer;
  }

  .device-row:hover {
    background: rgba(128, 128, 128, 0.18);
  }

  .device-row:active {
    opacity: 0.75;
  }

  .device-row.selected {
    background: rgba(47, 123, 242, 0.18);
  }

  .device-row.selected:hover {
    background: rgba(47, 123, 242, 0.28);
  }

  .device-text {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
  }

  .device-name {
    font-size: 1.1rem;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .device-identifier {
    font-size: 0.8rem;
    opacity: 0.65;
  }

  .device-address {
    flex: none;
    font-size: 0.9rem;
    opacity: 0.65;
    text-align: right;
  }

  .empty-row {
    padding: 28px 20px;
    border-radius: 12px;
    background: var(--card-background);
    text-align: center;
  }

  .spinner {
    display: inline-block;
    flex: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(128, 128, 128, 0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .busy-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .qr-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border-radius: 12px;
    background: var(--card-background);
    text-align: center;
  }

  .qr-image {
    width: 220px;
    height: 220px;
    border-radius: 8px;
    background: #fff;
  }

  .heading-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 4px;
  }

  .heading-row .section-heading {
    margin: 0 0 0 12px;
  }

  .icon-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    margin: 0 4px 0 0;
    border-radius: 50%;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }

  .icon-button:hover {
    background: rgba(128, 128, 128, 0.18);
  }

  .icon-button:active {
    opacity: 0.75;
  }

  .icon-button svg {
    width: 20px;
    height: 20px;
  }

  .button.disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .device-row:hover {
    background: rgba(128, 128, 128, 0.18);
  }

  .device-row.selected:hover {
    background: rgba(47, 123, 242, 0.28);
  }

  .device-row:active {
    opacity: 0.75;
  }

  .empty-row {
    padding: 16px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(30, 30, 30, 0.92);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    transform: translateX(-50%);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  .toast.saved {
    background: #34c759;
  }

  .toast.error {
    background: #e5484d;
  }
</style>

<main class="page">
  <p class="muted intro-text" data-i18n="pair.accountIntro"></p>

  <div id="qr-area" class="qr-area">
    <img id="qr-image" class="qr-image" alt="" hidden />
    <span class="busy-row muted small">
      <span id="status-spinner" class="spinner"></span>
      <span id="status" data-i18n="pair.accountWaiting"></span>
    </span>
  </div>

  <div id="devices-area" hidden>
    <h2 class="section-heading" data-i18n="pair.accountDevices"></h2>
    <p class="muted small intro-text" data-i18n="pair.accountChoose"></p>
    <div id="found"></div>
  </div>

  <div class="buttons">
    <span id="continue" class="button primary disabled" role="button" tabindex="0" aria-disabled="true" data-i18n="pair.continue" hidden></span>
    <span id="retry" class="button" role="button" tabindex="0" data-i18n="pair.accountNewCode" hidden></span>
    <span id="manual" class="button" role="button" tabindex="0" data-i18n="pair.manual"></span>
  </div>
</main>

<script>
  const POLL_INTERVAL_MILLISECONDS = 2000;

  const qrArea = document.getElementById("qr-area");
  const qrImage = document.getElementById("qr-image");
  const statusElement = document.getElementById("status");
  const statusSpinner = document.getElementById("status-spinner");
  const devicesArea = document.getElementById("devices-area");
  const foundElement = document.getElementById("found");
  const continueButton = document.getElementById("continue");
  const retryButton = document.getElementById("retry");
  let selectedDevice = null;
  let pollTimer = null;

  function describeError(error) {
    const text = Homey.__("pair.errors." + error.message);
    return text && text !== "pair.errors." + error.message ? text : error.message;
  }

  function activateOnClickOrKey(element, action) {
    element.addEventListener("click", action);
    element.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        action();
      }
    });
  }

  function translatePage() {
    Homey.setTitle(Homey.__("pair.title"));
    document.querySelectorAll("[data-i18n]").forEach((element) => {
      element.textContent = Homey.__(element.dataset.i18n);
    });
  }

  function showStatus(text) {
    statusElement.textContent = text;
  }

  function showMessageInList(text, busy) {
    const row = document.createElement("div");
    row.className = "empty-row muted small" + (busy ? " busy-row" : "");
    if (busy) {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      row.append(spinner);
    }
    const label = document.createElement("span");
    label.textContent = text;
    row.append(label);
    foundElement.replaceChildren(row);
  }

  function selectDevice(row, device) {
    foundElement.querySelectorAll(".device-row").forEach((other) => {
      other.classList.toggle("selected", other === row);
    });
    selectedDevice = device;
    continueButton.classList.remove("disabled");
    continueButton.setAttribute("aria-disabled", "false");
  }

  function buildDeviceRow(device) {
    const row = document.createElement("div");
    row.className = "device-row";
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    const name = document.createElement("span");
    name.className = "device-name";
    name.textContent = device.name || device.model;
    const identifier = document.createElement("span");
    identifier.className = "device-identifier";
    identifier.textContent = device.model;
    const text = document.createElement("span");
    text.className = "device-text";
    text.append(name, identifier);
    const address = document.createElement("span");
    address.className = "device-address";
    address.textContent = device.address;
    row.append(text, address);
    activateOnClickOrKey(row, () => selectDevice(row, device));
    return row;
  }

  async function showDevices() {
    qrArea.hidden = true;
    devicesArea.hidden = false;
    showMessageInList(Homey.__("pair.accountSearching"), true);
    try {
      const devices = await Homey.emit("account_devices", {});
      if (devices.length === 0) {
        showMessageInList(Homey.__("pair.accountNoDevices"));
        return;
      }
      foundElement.replaceChildren(...devices.map(buildDeviceRow));
      continueButton.hidden = false;
    } catch (error) {
      showMessageInList(describeError(error));
    }
  }

  async function continueWithSelectedDevice() {
    if (selectedDevice === null) {
      return;
    }
    await Homey.setViewStoreValue("pair", "address", selectedDevice.address);
    await Homey.setViewStoreValue("pair", "name", selectedDevice.name);
    await Homey.setViewStoreValue("pair", "token", selectedDevice.token);
    Homey.showView("pair");
  }

  function stopPolling() {
    clearTimeout(pollTimer);
  }

  function endWithMessage(textKey) {
    stopPolling();
    statusSpinner.hidden = true;
    showStatus(Homey.__(textKey));
    qrImage.hidden = true;
    retryButton.hidden = false;
  }

  async function checkStatus() {
    try {
      const { state } = await Homey.emit("account_login_status", {});
      if (state === "signed_in") {
        stopPolling();
        showStatus(Homey.__("pair.accountSignedIn"));
        await showDevices();
        return;
      }
      if (state === "expired") {
        endWithMessage("pair.accountExpired");
        return;
      }
      if (state === "failed") {
        endWithMessage("pair.accountFailed");
        return;
      }
    } catch (error) {
      showStatus(describeError(error));
    }
    pollTimer = setTimeout(checkStatus, POLL_INTERVAL_MILLISECONDS);
  }

  async function startLogin() {
    stopPolling();
    retryButton.hidden = true;
    statusSpinner.hidden = false;
    showStatus(Homey.__("pair.accountWaiting"));
    try {
      const login = await Homey.emit("start_account_login", {});
      qrImage.src = login.qrImage;
      qrImage.hidden = false;
      pollTimer = setTimeout(checkStatus, POLL_INTERVAL_MILLISECONDS);
    } catch (error) {
      showStatus(describeError(error));
      retryButton.hidden = false;
    }
  }

  translatePage();
  activateOnClickOrKey(continueButton, continueWithSelectedDevice);
  activateOnClickOrKey(retryButton, startLogin);
  activateOnClickOrKey(document.getElementById("manual"), () => Homey.showView("pair"));
  startLogin();
</script>
