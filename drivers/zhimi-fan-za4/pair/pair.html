<style>
  :root {
    --accent: #2f7bf2;
    --line-color: rgba(128, 128, 128, 0.25);
    --card-background: rgba(128, 128, 128, 0.08);
  }

  [hidden] {
    display: none !important;
  }

  .page {
    padding: 4px 0 24px;
  }

  .muted {
    opacity: 0.65;
  }

  .small {
    font-size: 0.85rem;
  }

  .intro-text {
    margin: 4px 0 12px;
  }

  .help-text {
    margin: 8px 0 0;
  }

  .section-heading {
    margin: 18px 16px 6px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .card {
    background: var(--card-background);
    border-radius: 14px;
    overflow: hidden;
  }

  .text-input {
    box-sizing: border-box !important;
    width: 100%;
    height: 44px !important;
    padding: 0 16px !important;
    border: 0;
    border-radius: 10px;
    background: var(--card-background);
    color: inherit;
    font: inherit;
    line-height: 44px !important;
    text-indent: 0 !important;
    -webkit-appearance: none;
    appearance: none;
  }

  .text-input:focus {
    outline: 2px solid var(--accent);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    padding: 8px 16px;
    text-transform: none;
  }

  .setting-label {
    font-size: 1rem;
  }

  .number-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .number-input {
    box-sizing: border-box !important;
    width: 84px;
    height: 38px !important;
    padding: 0 12px !important;
    border: 0;
    border-radius: 9px;
    background: rgba(128, 128, 128, 0.18);
    color: inherit;
    font: inherit;
    line-height: 38px !important;
    text-align: right;
    text-indent: 0 !important;
  }

  .number-input:focus {
    outline: 2px solid var(--accent);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }

  .button {
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--card-background);
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    text-transform: none;
    cursor: pointer;
    user-select: none;
  }

  .button.primary {
    background: var(--accent);
    color: #fff;
  }

  .button:active {
    opacity: 0.75;
  }

  .device-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    padding: 8px 16px;
    cursor: pointer;
    text-transform: none;
  }

  .device-row + .device-row {
    border-top: 1px solid var(--line-color);
  }

  .device-row.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .device-row:active {
    opacity: 0.75;
  }

  .empty-row {
    padding: 16px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(30, 30, 30, 0.92);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    transform: translateX(-50%);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  .toast.saved {
    background: #34c759;
  }

  .toast.error {
    background: #e5484d;
  }
</style>

<main class="page">
  <p class="muted intro-text" data-i18n="pair.intro"></p>

  <h2 class="section-heading" data-i18n="pair.name"></h2>
  <input id="name" class="text-input" type="text" maxlength="64" autocomplete="off" />

  <h2 class="section-heading" data-i18n="pair.address"></h2>
  <input id="address" class="text-input" type="text" inputmode="decimal" autocomplete="off" />

  <h2 class="section-heading" data-i18n="pair.token"></h2>
  <input id="token" class="text-input" type="password" maxlength="32" autocomplete="off" />
  <p class="muted small help-text" data-i18n="pair.tokenHelp"></p>

  <h2 class="section-heading" data-i18n="pair.settings"></h2>
  <div class="card">
    <div class="setting-row">
      <span class="setting-label" data-i18n="pair.polling"></span>
      <span class="number-group">
        <input id="polling" class="number-input" type="number" min="5" max="600" step="1" value="10" inputmode="numeric" />
        <span class="muted" data-i18n="pair.seconds"></span>
      </span>
    </div>
  </div>
  <p class="muted small help-text" data-i18n="pair.pollingHelp"></p>

  <div class="buttons">
    <span id="add" class="button primary" role="button" tabindex="0" data-i18n="pair.add"></span>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
  const ERROR_DURATION_MILLISECONDS = 3500;
  const SAVED_DURATION_MILLISECONDS = 1800;

  const toastElement = document.getElementById("toast");
  let hideTimer = null;

  function showToast(text, kind, durationMilliseconds) {
    clearTimeout(hideTimer);
    toastElement.textContent = text;
    toastElement.className = "toast " + kind;
    toastElement.hidden = false;
    if (durationMilliseconds) {
      hideTimer = setTimeout(() => {
        toastElement.hidden = true;
      }, durationMilliseconds);
    }
  }

  function describeError(error) {
    const text = Homey.__("pair.errors." + error.message);
    return text && text !== "pair.errors." + error.message ? text : error.message;
  }

  function readForm() {
    return {
      name: document.getElementById("name").value,
      address: document.getElementById("address").value,
      token: document.getElementById("token").value,
      polling: Number(document.getElementById("polling").value),
    };
  }

  async function addDevice() {
    showToast(Homey.__("pair.adding"), "saving", 0);
    try {
      const device = await Homey.emit("validate_device", readForm());
      await Homey.createDevice(device);
      showToast(Homey.__("pair.added"), "saved", SAVED_DURATION_MILLISECONDS);
      Homey.done();
    } catch (error) {
      showToast(describeError(error), "error", ERROR_DURATION_MILLISECONDS);
    }
  }

  function activateOnClickOrKey(element, action) {
    element.addEventListener("click", action);
    element.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        action();
      }
    });
  }

  Homey.setTitle(Homey.__("pair.title"));

  document.querySelectorAll("[data-i18n]").forEach((element) => {
    element.textContent = Homey.__(element.dataset.i18n);
  });

  activateOnClickOrKey(document.getElementById("add"), addDevice);
  Homey.getViewStoreValue("pair", "address").then((address) => {
    if (address) {
      document.getElementById("address").value = address;
    }
  });
</script>
