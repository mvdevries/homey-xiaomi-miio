<style>
  :root {
    --accent: #2f7bf2;
    --line-color: rgba(128, 128, 128, 0.25);
    --card-background: rgba(128, 128, 128, 0.08);
  }

  [hidden] {
    display: none !important;
  }

  .page {
    padding: 4px 0 24px;
  }

  .muted {
    opacity: 0.65;
  }

  .small {
    font-size: 0.85rem;
  }

  .intro-text {
    margin: 4px 0 12px;
  }

  .help-text {
    margin: 8px 0 0;
  }

  .section-heading {
    margin: 18px 16px 6px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .card {
    background: var(--card-background);
    border-radius: 14px;
    overflow: hidden;
  }

  .text-input {
    box-sizing: border-box !important;
    width: 100%;
    height: 44px !important;
    padding: 0 16px !important;
    border: 0;
    border-radius: 10px;
    background: var(--card-background);
    color: inherit;
    font: inherit;
    line-height: 44px !important;
    text-indent: 0 !important;
    -webkit-appearance: none;
    appearance: none;
  }

  .text-input:focus {
    outline: 2px solid var(--accent);
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    padding: 8px 16px;
    text-transform: none;
  }

  .setting-label {
    font-size: 1rem;
  }

  .number-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .number-input {
    box-sizing: border-box !important;
    width: 84px;
    height: 38px !important;
    padding: 0 12px !important;
    border: 0;
    border-radius: 9px;
    background: rgba(128, 128, 128, 0.18);
    color: inherit;
    font: inherit;
    line-height: 38px !important;
    text-align: right;
    text-indent: 0 !important;
  }

  .number-input:focus {
    outline: 2px solid var(--accent);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }

  .button {
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--card-background);
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    text-transform: none;
    cursor: pointer;
    user-select: none;
  }

  .button.primary {
    background: var(--accent);
    color: #fff;
  }

  .button:active {
    opacity: 0.75;
  }

  .device-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
    padding: 8px 16px;
    cursor: pointer;
    text-transform: none;
  }

  .device-row + .device-row {
    border-top: 1px solid var(--line-color);
  }

  .device-row.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .device-row:active {
    opacity: 0.75;
  }

  .empty-row {
    padding: 16px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(30, 30, 30, 0.92);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    transform: translateX(-50%);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }

  .toast.saved {
    background: #34c759;
  }

  .toast.error {
    background: #e5484d;
  }
</style>

<main class="page">
  <p class="muted intro-text" data-i18n="pair.startIntro"></p>

  <div class="card">
    <div id="search" class="device-row" role="button" tabindex="0">
      <span>
        <span data-i18n="pair.search"></span><br />
        <span class="muted small" data-i18n="pair.searchHelp"></span>
      </span>
    </div>
    <div id="manual" class="device-row" role="button" tabindex="0">
      <span>
        <span data-i18n="pair.manual"></span><br />
        <span class="muted small" data-i18n="pair.manualHelp"></span>
      </span>
    </div>
  </div>
</main>

<script>
  function activateOnClickOrKey(element, action) {
    element.addEventListener("click", action);
    element.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        action();
      }
    });
  }

  function translatePage() {
    Homey.setTitle(Homey.__("pair.title"));
    document.querySelectorAll("[data-i18n]").forEach((element) => {
      element.textContent = Homey.__(element.dataset.i18n);
    });
  }

  translatePage();
  activateOnClickOrKey(document.getElementById("search"), () => Homey.showView("discover"));
  activateOnClickOrKey(document.getElementById("manual"), () => Homey.showView("pair"));
</script>
